version: 2

updates:
  # The published qbittorrent-nox image is a production artifact, and its base
  # is a distribution release that will eventually reach end of life. An
  # unmonitored base image forfeits the argument for carrying a patched engine
  # at all: the reason to build from source rather than consume a stock binary
  # is that the patch stream stays current, and a stale base contradicts that.
  - package-ecosystem: "docker"
    directory: "/nox-build/linux"
    commit-message:
      prefix: "nox build"
    groups:
      docker:
        patterns:
          - "*"
    schedule:
      interval: "monthly"

  # Measured 2026-08-12: Dependabot DOES bump actions pinned to a commit SHA,
  # and rewrites the trailing `# vX.Y.Z` comment with them. Every action in the
  # workflows is SHA-pinned and stays maintained here.
  #
  # Grouped updates arrive as one pull request. A scan that finds a new update
  # while such a PR is already open rebases that PR rather than adding the new
  # member to it, so "this action is absent from the open PR" is not evidence
  # that Dependabot ignores it -- read the PR raised after the next scan.
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"
