version: 2

updates:
  # The published qbittorrent-nox image is a production artifact, and its base
  # is a distribution release that will eventually reach end of life. An
  # unmonitored base image forfeits the argument for carrying a patched engine
  # at all: the reason to build from source rather than consume a stock binary
  # is that the patch stream stays current, and a stale base contradicts that.
  - package-ecosystem: "docker"
    directory: "/nox-build/linux"
    commit-message:
      prefix: "nox build"
    groups:
      docker:
        patterns:
          - "*"
    schedule:
      interval: "monthly"

  # Measured 2026-08-12: Dependabot does not bump actions pinned to a commit
  # SHA. Pinning actions/checkout one patch behind produced no PR, while three
  # tag-pinned actions in the same group and the same run were bumped. Every
  # action here is SHA-pinned, so this block currently raises nothing. It is
  # kept because the measurement may stop being true, and because removing it
  # would silently drop the ecosystem if a future action is added on a tag.
  # Action bumps are a step in CLAUDE.md's merge procedure, not automatic.
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "GHA CI"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "CI"
    schedule:
      interval: "monthly"
